<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartBuy AI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>SmartBuy AI</h1>
    <p class="subtitle">Best price &amp; best value finder</p>

    <form id="search-form">
      <input id="query" type="text" placeholder="e.g. Sony WH-1000XM5 headphones" autocomplete="off" required />
      <button type="submit">Search</button>
    </form>

    <div id="status"></div>
    <div id="result"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
